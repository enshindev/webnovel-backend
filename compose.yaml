x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://webnovel:webnovel@postgres:5432/webnovel
  REDIS_URL: redis://redis:6379/0
  PROMPTS_DIR: /app/prompts
  EVALS_DIR: /app/evals
  KNOWLEDGE_DIR: /app/knowledge
  PLATFORM_CONFIG_PATH: /app/config/platform.yaml
  ROUTING_CONFIG_PATH: /app/config/routing.yaml
  PRICING_CONFIG_PATH: /app/config/pricing.yaml
  EXPORT_DIR: /app/data/exports
  LIBRARY_DIR: /app/data/library

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: webnovel
      POSTGRES_PASSWORD: webnovel
      POSTGRES_DB: webnovel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webnovel -d webnovel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    command:
      - sh
      - -c
      - /app/.venv/bin/alembic upgrade head && /app/.venv/bin/webnovel serve --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - appdata:/app/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
    command: ["/app/.venv/bin/webnovel", "worker"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - appdata:/app/data
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.60
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pgdata:
  redisdata:
  appdata:
