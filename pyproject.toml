[project]
name = "webnovel-backend"
version = "0.1.0"
description = "AI 网文创作平台后端（单用户自托管，开源自用）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "webnovel contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "redis>=5.0,<6",
  "arq>=0.26,<1",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "pyyaml>=6.0,<7",
  "tiktoken>=0.7,<1",
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp>=1.25,<2",
  "opentelemetry-exporter-prometheus>=0.46b0,<1",
  "structlog>=24.1,<26",
  "pgvector>=0.3,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "import-linter>=2.0,<3",
  "pre-commit>=3.7,<4",
  "types-PyYAML>=6.0,<7",
]
experiments = [
  "langgraph>=0.2,<1",
]
export = [
  "python-docx>=1.1,<2",
]
retrieval = [
  "rank-bm25>=0.2,<1",
]
library = [
  "pypdf>=5,<6",
]
ocr = [
  "pytesseract>=0.3,<1",
  "Pillow>=10,<14",
  "rapidocr-onnxruntime>=1.4,<2",
]
test-servers = [
  "pgserver>=0.1,<1",
  "redislite>=6.2,<7",
]

[project.scripts]
webnovel = "webnovel.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webnovel"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party", "docs", ".scratch", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["integration: requires external PostgreSQL/Redis"]

[tool.importlinter]
root_packages = ["webnovel"]

[[tool.importlinter.contracts]]
name = "kernel is independent"
type = "forbidden"
source_modules = ["webnovel.kernel"]
forbidden_modules = ["webnovel.entrypoints", "webnovel.infra", "webnovel.llm", "webnovel.modules"]

[[tool.importlinter.contracts]]
name = "infra must not depend on llm, modules or entrypoints"
type = "forbidden"
source_modules = ["webnovel.infra"]
forbidden_modules = ["webnovel.llm", "webnovel.modules", "webnovel.entrypoints"]

[[tool.importlinter.contracts]]
name = "llm must not depend on modules or entrypoints"
type = "forbidden"
source_modules = ["webnovel.llm"]
forbidden_modules = ["webnovel.modules", "webnovel.entrypoints"]

[[tool.importlinter.contracts]]
name = "runtime must not import evalkit"
type = "forbidden"
source_modules = [
  "webnovel.llm",
  "webnovel.modules",
  "webnovel.infra",
  "webnovel.entrypoints.api",
  "webnovel.entrypoints.worker",
]
forbidden_modules = ["webnovel.evalkit"]
