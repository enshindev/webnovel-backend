# 任务路由：每类任务一个有序 provider 列表；只在可重试错误时降级。
# 可以追加 provider；字段支持 ${ENV} 占位符。
profiles:
  generation:
    providers:
      - name: default
        base_url: ${LLM_BASE_URL}
        api_key: ${LLM_API_KEY}
        model: ${LLM_MODEL}
        timeout_seconds: 120
        max_retries: 2
      - name: local
        base_url: ${LOCAL_LLM_BASE_URL}
        api_key: ${LOCAL_LLM_API_KEY}
        model: ${LOCAL_LLM_MODEL}
        timeout_seconds: 300
        max_retries: 1
  batch:
    providers:
      - name: default
        base_url: ${LLM_BASE_URL}
        api_key: ${LLM_API_KEY}
        model: ${LLM_MODEL}
        timeout_seconds: 300
        max_retries: 2
      - name: local
        base_url: ${LOCAL_LLM_BASE_URL}
        api_key: ${LOCAL_LLM_API_KEY}
        model: ${LOCAL_LLM_MODEL}
        timeout_seconds: 600
        max_retries: 1
  embedding:
    providers: []
  moderation:
    providers: []
  asr:
    providers:
      - name: default
        base_url: ${ASR_BASE_URL}
        api_key: ${ASR_API_KEY}
        model: ${ASR_MODEL}
        timeout_seconds: 120
        max_retries: 1
  tts:
    providers:
      - name: default
        base_url: ${TTS_BASE_URL}
        api_key: ${TTS_API_KEY}
        model: ${TTS_MODEL}
        timeout_seconds: 180
        max_retries: 1
  image:
    providers:
      - name: default
        base_url: ${IMAGE_BASE_URL}
        api_key: ${IMAGE_API_KEY}
        model: ${IMAGE_MODEL}
        timeout_seconds: 180
        max_retries: 1
