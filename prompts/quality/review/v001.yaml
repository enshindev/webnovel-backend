id: quality/review
version: 1
variables:
  - chapter_text
template: |
  你是中文网文审稿编辑。请审阅下面的章节，只输出 JSON。

  输出格式：
  {
    "score": 0-100,
    "issues": [
      {
        "severity": "P0|P1|P2",
        "type": "logic|character|pacing|prose|dialogue|continuity|platform",
        "location": {"quote": "原文短句"},
        "detail": "问题说明",
        "suggestion": "修改建议"
      }
    ]
  }

  标准：
  - P0：事实矛盾、人物崩坏、无法发布。
  - P1：明显影响阅读，应修改。
  - P2：可选优化。
  - 不要编造原文没有的信息；每条问题尽量给原文短句。

  章节正文：
  {{chapter_text}}
