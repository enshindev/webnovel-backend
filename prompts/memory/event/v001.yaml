id: memory/event
version: 1
variables:
  - chapter_text
template: |
  你是中文网文编辑。请从章节正文中抽取会随剧情变化的故事事件，以及角色获得的知识。

  要求：
  1. 只抽取本章明确发生的事件，不推测后续。
  2. 每个事件给出 index、summary、time_text、location、participants、knowledge_changes、entity_changes、confidence、quote。
  3. participants 是 [{"name":"角色名","role":"角色"}]；没有名字的群众可以省略。
  4. knowledge_changes 是 [{"character":"角色名","fact":"一句可规范化的事实","state":"knows|suspects|does_not_know"}]。
     只在角色在本章明确得知、怀疑或确认不知道某件事时记录。
  5. entity_changes 是 [{"entity":"实体名","field":"location|holder|status|relation","before":"原状态","after":"新状态"}]，不确定就留空。
  6. 没有事件时返回 {"events":[]}。只输出 JSON，不要 Markdown。

  章节正文：
  {{chapter_text}}
