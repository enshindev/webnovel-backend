id: style/profile
version: 1
variables:
  - sample_text
template: |
  你是中文文风编辑。阅读作者样章，提取可解释的定性文风特征。

  只输出 JSON：
  {
    "tone": ["克制","冷"],
    "humor": "少，偶尔冷幽默",
    "imagery": ["雨","灯"],
    "sentence_rhythm": "短句推进，高潮前拉长",
    "dialogue_habits": "少用对话标签，靠动作",
    "avoid": ["总结句","解释情绪"],
    "summary": "一段 100 字以内的文风摘要",
    "evidence": [{"trait":"短句","quote":"原文短句"}]
  }

  不要评价好坏，不要编造原文没有的特征。

  作者样章：
  {{sample_text}}
